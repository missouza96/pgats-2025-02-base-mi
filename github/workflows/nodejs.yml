name: Node.js CI

on:
  push:
    branches: ["staging"]
  pull_request:
    branches: ["staging"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout repository
    - uses: actions/checkout@v4
  
    - name: Setup Node.js
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run software tests
      run: npm test

    - name: Starting API  
      run: npm start &

    - name: Waiting API
      run: sleep 5  

    - name: Run API tests HTTP
      run: npm test-external
