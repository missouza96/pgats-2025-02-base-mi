name: Pipeline Trabalho final API Rest - CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Run unit tests
      run: npm test-controller

    - name: Start REST API
      run: npm run start-rest &
    
    - name: Wait for API
      run: sleep 5

    - name: Run external API tests
      run: npm run test-external